<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <ion-list id="securelab-list">
          <ion-list-header>
            <ion-icon name="shield-checkmark-outline"
              style="margin-right: 8px; font-size: 24px; color: var(--ion-color-primary);"></ion-icon>
            SecureLab
          </ion-list-header>
          <ion-note>Control de Acceso e Inventario</ion-note>

          @for (p of paginasVisibles; track p; let i = $index) {
          <ion-menu-toggle auto-hide="false">
            <ion-item routerDirection="root" [routerLink]="[p.url]" lines="none" detail="false"
              routerLinkActive="selected">
              <ion-icon aria-hidden="true" slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
              <ion-label>{{ p.title }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
          }

          <ion-menu-toggle auto-hide="false">
            <ion-item button lines="none" detail="false" (click)="cerrarSesion()">
              <ion-icon aria-hidden="true" slot="start" ios="log-out-outline" md="log-out-sharp"></ion-icon>
              <ion-label>Cerrar sesión</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
